<meta name="apple-mobile-web-app-title" content="体重ノート">

<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#1c2530; --sub:#6b7785; --line:#e3e8ee;
  --accent:#1f8a70; --accent-ink:#fff; --warn:#d1495b; --goal:#e0902b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171c; --card:#1b222a; --ink:#e8edf2; --sub:#93a0ad; --line:#2a333d; --accent:#36b595; --accent-ink:#06231b;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.app{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:17px;margin:0;font-weight:700}
.date{font-size:13px;color:var(--sub)}

/* ① 大きな体重 + 横スワイプでグラフ */
.hero{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pager{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;min-height:268px;padding:22px 18px 8px;display:flex;flex-direction:column}
.slide.main{align-items:center;justify-content:center;text-align:center}
.label{font-size:13px;color:var(--sub)}
.big{font-size:84px;font-weight:800;letter-spacing:-2px;line-height:1.05;margin:6px 0 0;font-variant-numeric:tabular-nums}
.big small{font-size:28px;font-weight:700;margin-left:4px;letter-spacing:0;color:var(--sub)}
.bmi{margin-top:6px;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.bmi .cat{font-size:13px;font-weight:600;color:var(--sub);margin-left:8px}
.bmr{margin-top:4px;font-size:15px;font-weight:600;color:var(--sub);font-variant-numeric:tabular-nums}
.bmr b{color:var(--ink)}
.bmi-link{margin-top:8px;border:none;background:none;color:var(--accent);font-size:13px;font-family:inherit;padding:4px}
.seg{display:flex;gap:8px}
.seg label{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:11px 4px;font-size:14px;cursor:pointer}
.seg input{display:none}
.seg input:checked+span{color:var(--accent);font-weight:700}
.seg label:has(input:checked){border-color:var(--accent);background:rgba(31,138,112,.10)}
.btn.sm{padding:16px 14px;font-size:15px}
.delta{margin-top:8px;font-size:14px;color:var(--sub)}
.delta b.down{color:var(--accent)} .delta b.up{color:var(--warn)}
.hint{margin-top:16px;font-size:12px;color:var(--sub)}
.dots{display:flex;gap:7px;justify-content:center;padding:6px 0 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.2s}
.dots i.on{background:var(--accent);width:18px;border-radius:4px}
.ranges{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.ranges button{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:14px;padding:4px 12px;font-size:12px}
.ranges button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
svg#chart{width:100%;height:auto;display:block}
svg text{fill:var(--sub);font-size:10px}
.empty{color:var(--sub);text-align:center;margin:auto}

/* ③ 目標 */
.goal{margin-top:14px;background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.goal-top{display:flex;justify-content:space-between;align-items:baseline}
.goal-main{font-size:20px;font-weight:700}
.goal-main em{font-style:normal;color:var(--goal);font-size:26px}
.goal-kcal{margin-top:10px;font-size:18px;font-weight:700;color:var(--accent)}
.goal-kcal em{font-style:normal;font-size:24px}
.goal-kcal .sub{display:block;font-size:12px;font-weight:500;color:var(--sub);margin-top:2px}
.goal-kcal .warn{color:var(--warn)}
.goal-edit{border:none;background:none;color:var(--accent);font-size:13px;padding:4px 0}
.bar{height:10px;background:var(--line);border-radius:6px;margin-top:12px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:6px;width:0;transition:width .4s}
.goal-sub{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}

/* 履歴 */
.list{margin-top:14px;background:var(--card);border-radius:18px;padding:6px 16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.list h2{font-size:13px;color:var(--sub);margin:12px 0 4px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-of-type{border-top:none}
.row .d{color:var(--sub);font-size:13px}
.row .tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:6px}
.row .v{font-weight:700;font-variant-numeric:tabular-nums}
.del{border:none;background:none;color:var(--sub);font-size:12px;margin-left:10px;padding:6px}
.del.armed{color:var(--warn);font-weight:700}

/* 下部ボタン */
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;max-width:480px;margin:0 auto}
.btn{border:none;border-radius:16px;font-size:16px;font-weight:700;padding:16px;font-family:inherit}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.preview{width:100%;max-height:150px;object-fit:contain;border-radius:12px;background:#000;display:none;margin-bottom:10px}
.status{font-size:13px;color:var(--sub);margin-bottom:10px;min-height:18px}
.status.err{color:var(--warn)}
.numrow{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.numrow input{font-size:44px;font-weight:800;width:100%;border:none;border-bottom:2px solid var(--accent);background:transparent;color:var(--ink);
  padding:2px 0;font-family:inherit;font-variant-numeric:tabular-nums;outline:none}
.numrow span{font-size:20px;font-weight:700;color:var(--sub)}
.check{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:16px;margin-bottom:10px}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.result{font-size:15px;margin:4px 0 16px}
.result b{font-size:22px}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.field{margin-bottom:14px}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input{width:100%;font-size:22px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header><h1>体重ノート</h1><div class="date" id="today"></div></header>

  <!-- ① 現在の体重(横スワイプでグラフ) -->
  <div class="hero">
    <div class="pager" id="pager">
      <section class="slide main">
        <div class="label">現在の体重</div>
        <div class="big" id="bigWeight">--<small>kg</small></div>
        <div class="bmi" id="bmi"></div>
        <div class="delta" id="delta"></div>
        <div class="hint">← 数値を左にスワイプでグラフ</div>
      </section>
      <section class="slide">
        <div class="ranges" id="ranges">
          <button data-r="7">7日</button><button data-r="30" class="on">30日</button><button data-r="90">90日</button><button data-r="0">全期間</button>
        </div>
        <svg id="chart" viewBox="0 0 320 220" role="img" aria-label="体重グラフ"></svg>
      </section>
    </div>
    <div class="dots" id="dots"><i class="on"></i><i></i></div>
  </div>

  <!-- ③ 目標 -->
  <div class="goal" id="goalCard">
    <div class="goal-top">
      <div class="goal-main" id="goalMain">目標を設定しましょう</div>
      <button class="goal-edit" id="goalEdit">目標を設定</button>
    </div>
    <div class="goal-kcal" id="goalKcal"></div>
    <div class="bar"><div id="goalBar"></div></div>
    <div class="goal-sub"><span id="goalStart"></span><span id="goalTarget"></span></div>
  </div>

  <div class="list">
    <h2>記録</h2>
    <div id="rows"></div>
  </div>
</div>

<div class="dock">
  <button class="btn ghost sm" id="manualBtn">手入力</button>
  <button class="btn primary" id="camBtn">📷 撮影</button>
  <button class="btn ghost sm" id="profileBtn">個人設定</button>
</div>
<!-- ② カメラ起動(スマホではこの入力でカメラが開く) -->
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<!-- 記録の確認 -->
<div class="modal" id="confirmModal">
  <div class="sheet">
    <h3>こちらの数値を記録しますか？</h3>
    <canvas id="preview" class="preview"></canvas>
    <div class="status" id="ocrStatus"></div>
    <div class="numrow"><input id="rawInput" type="number" inputmode="decimal" step="0.1" min="20" max="300" placeholder="00.0"><span>kg</span></div>
    <label class="check"><input type="checkbox" id="clothes"><span>衣服を着ている（−1.0kg で計算）</span></label>
    <div class="result" id="result"></div>
    <div class="btns">
      <button class="btn ghost" id="cancelBtn">キャンセル</button>
      <button class="btn primary" id="saveBtn" disabled>記録する</button>
    </div>
  </div>
</div>

<!-- 個人設定 -->
<div class="modal" id="profileModal">
  <div class="sheet">
    <h3>個人設定</h3>
    <div class="field"><label>性別</label>
      <div class="seg" id="sexSeg">
        <label><input type="radio" name="sex" value="male"><span>男性</span></label>
        <label><input type="radio" name="sex" value="female"><span>女性</span></label>
        <label><input type="radio" name="sex" value="other"><span>回答しない</span></label>
      </div>
    </div>
    <div class="field"><label>身長 (cm)</label><input id="heightInput" type="number" inputmode="decimal" step="0.1" min="100" max="250"></div>
    <div class="field"><label>年齢</label><input id="ageInput" type="number" inputmode="numeric" step="1" min="1" max="120"></div>
    <div class="btns">
      <button class="btn ghost" id="profileCancel">閉じる</button>
      <button class="btn primary" id="profileSave">保存</button>
    </div>
  </div>
</div>

<!-- 目標設定 -->
<div class="modal" id="goalModal">
  <div class="sheet">
    <h3>目標体重</h3>
    <div class="field"><label>目標体重 (kg)</label><input id="goalInput" type="number" inputmode="decimal" step="0.1" min="20" max="300"></div>
    <div class="field"><label>いつまでに？（カレンダーから選択）</label><input id="goalDateInput" type="date"></div>
    <div class="btns">
      <button class="btn ghost" id="goalCancel">閉じる</button>
      <button class="btn primary" id="goalSave">保存</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const KEY='weightApp.v1';
const CLOTHES_KG=1.0;
let state={records:[],goal:null,goalDate:null,profile:{sex:'',height:null,age:null}};
let range=30;

/* ---------- 保存 ---------- */
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.records)){state=s;if(!state.profile)state.profile={sex:'',height:null,age:null};}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
const sorted=()=>state.records.slice().sort((a,b)=>a.ts-b.ts);
const r1=v=>Math.round(v*10)/10;
const fmtD=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate();};
const fmtFull=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};

/* ---------- 描画 ---------- */
function render(){
  const recs=sorted();
  const last=recs[recs.length-1], prev=recs[recs.length-2];
  $('bigWeight').innerHTML=(last?last.kg.toFixed(1):'--')+'<small>kg</small>';
  if(last&&prev){
    const d=r1(last.kg-prev.kg);
    const cls=d<0?'down':d>0?'up':'';
    $('delta').innerHTML='前回比 <b class="'+cls+'">'+(d>0?'+':'')+d.toFixed(1)+' kg</b>';
  }else{ $('delta').textContent=last?(fmtFull(last.ts)+' 記録'):'まだ記録がありません'; }
  renderBmi(last);
  renderGoal(recs);
  renderChart(recs);
  renderRows(recs);
}

const KCAL_PER_KG=7200; // 体脂肪1kgあたりの目安
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
function daysLeft(str){ // 今日から期限日までの日数(今日=0)
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(str||'');if(!m)return null;
  const end=new Date(+m[1],+m[2]-1,+m[3]),n=new Date(),today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((end-today)/864e5);
}
function renderGoal(recs){
  const g=state.goal, last=recs[recs.length-1];
  const main=$('goalMain'), bar=$('goalBar'), kc=$('goalKcal');
  kc.innerHTML='';
  $('goalEdit').textContent=g==null?'目標を設定':'変更';
  if(g==null){main.textContent='目標を設定しましょう';bar.style.width='0';$('goalStart').textContent='';$('goalTarget').textContent='';return;}
  const dl=daysLeft(state.goalDate);
  let tgt='目標 '+g.toFixed(1)+' kg';
  if(dl!=null){const p=state.goalDate.split('-');tgt+=' ・ '+(+p[1])+'/'+(+p[2])+'まで';}
  $('goalTarget').textContent=tgt;
  if(!last){main.textContent='目標 '+g.toFixed(1)+' kg';bar.style.width='0';$('goalStart').textContent='';return;}
  const start=recs[0].kg, diff=r1(last.kg-g);
  $('goalStart').textContent='開始 '+start.toFixed(1)+' kg';
  if(Math.abs(diff)<0.05){main.innerHTML='🎉 目標達成！';bar.style.width='100%';return;}
  main.innerHTML='目標まであと <em>'+Math.abs(diff).toFixed(1)+'</em> kg';
  const total=g-start;
  let pct=total===0?0:(last.kg-start)/total*100;
  pct=Math.max(0,Math.min(100,pct));
  bar.style.width=pct+'%';
  // あと◯◯kcal
  const kcal=Math.round(Math.abs(diff)*KCAL_PER_KG), verb=diff>0?'消費':'摂取';
  let h='あと <em>'+kcal.toLocaleString('ja-JP')+'</em> kcal '+verb+'！';
  if(dl!=null){
    if(dl<0){h+='<span class="sub">期限を過ぎています。日付を見直してみましょう</span>';}
    else{
      const days=Math.max(1,dl), per=Math.round(kcal/days);
      h+='<span class="sub">'+(dl===0?'今日が期限です':'残り '+dl+' 日')+' ・ 1日あたり約 '+per.toLocaleString('ja-JP')+' kcal</span>';
      if(diff>0&&per>1000)h+='<span class="sub warn">1日1,000kcal以上は負担が大きめです。期限を延ばすのがおすすめです</span>';
    }
  }
  kc.innerHTML=h;
}

function renderChart(all){
  const svg=$('chart'), W=320,H=220,pl=34,pr=14,pt=16,pb=26;
  let recs=all;
  if(range>0){const from=Date.now()-range*864e5;recs=all.filter(r=>r.ts>=from);}
  if(!recs.length){svg.innerHTML='<text x="160" y="110" text-anchor="middle" font-size="13">この期間の記録がありません</text>';return;}
  const vals=recs.map(r=>r.kg); if(state.goal!=null)vals.push(state.goal);
  let min=Math.min(...vals),max=Math.max(...vals);
  const pad=Math.max((max-min)*.18,.5); min-=pad;max+=pad;
  const t0=recs[0].ts,t1=recs[recs.length-1].ts;
  const x=ts=>t1===t0?(pl+W-pr)/2:pl+(ts-t0)/(t1-t0)*(W-pl-pr);
  const y=v=>pt+(max-v)/(max-min)*(H-pt-pb);
  let s='';
  for(let i=0;i<=3;i++){
    const v=min+(max-min)*i/3, yy=y(v);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(pl-5)+'" y="'+(yy+3)+'" text-anchor="end">'+v.toFixed(1)+'</text>';
  }
  if(state.goal!=null){
    const gy=y(state.goal);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--goal)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s+='<text x="'+(W-pr)+'" y="'+(gy-4)+'" text-anchor="end" style="fill:var(--goal)">目標 '+state.goal.toFixed(1)+'</text>';
  }
  const pts=recs.map(r=>x(r.ts).toFixed(1)+','+y(r.kg).toFixed(1));
  if(recs.length>1)s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  recs.forEach((r,i)=>{
    const isLast=i===recs.length-1;
    s+='<circle cx="'+x(r.ts).toFixed(1)+'" cy="'+y(r.kg).toFixed(1)+'" r="'+(isLast?4.5:3)+'" fill="var(--accent)"/>';
  });
  const lr=recs[recs.length-1];
  s+='<text x="'+Math.min(x(lr.ts),W-pr-8).toFixed(1)+'" y="'+(y(lr.kg)-9).toFixed(1)+'" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:11px">'+lr.kg.toFixed(1)+'</text>';
  s+='<text x="'+pl+'" y="'+(H-8)+'" text-anchor="start">'+fmtD(t0)+'</text>';
  if(t1!==t0)s+='<text x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end">'+fmtD(t1)+'</text>';
  svg.innerHTML=s;
}

let armedId=null;
function renderRows(recs){
  const box=$('rows');
  if(!recs.length){box.innerHTML='<div class="row"><span class="d">下の「撮影」か「手入力」から最初の記録を追加</span></div>';return;}
  box.innerHTML=recs.slice().reverse().slice(0,40).map(r=>
    '<div class="row"><span><span class="d">'+fmtFull(r.ts)+'</span>'+(r.clothes?'<span class="tag">衣服−1kg</span>':'')+'</span>'+
    '<span><span class="v">'+r.kg.toFixed(1)+' kg</span><button class="del'+(armedId===r.id?' armed':'')+'" data-id="'+r.id+'">'+(armedId===r.id?'削除する？':'削除')+'</button></span></div>'
  ).join('');
}
$('rows').addEventListener('click',e=>{
  const b=e.target.closest('.del');if(!b)return;
  const id=b.dataset.id;
  if(armedId===id){state.records=state.records.filter(r=>r.id!==id);armedId=null;save();render();}
  else{armedId=id;renderRows(sorted());setTimeout(()=>{if(armedId===id){armedId=null;renderRows(sorted());}},3000);}
});

/* ---------- スワイプ表示 ---------- */
$('pager').addEventListener('scroll',()=>{
  const p=$('pager');const i=Math.round(p.scrollLeft/p.clientWidth);
  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===i));
},{passive:true});
$('ranges').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  range=+b.dataset.r;[...$('ranges').children].forEach(x=>x.classList.toggle('on',x===b));
  renderChart(sorted());
});

/* ---------- ② 撮影 → OCR → 確認 ---------- */
let pending=null; // {ocrCanvas}
const modal=$('confirmModal');

function openConfirm(initial,statusHtml,statusErr){
  $('rawInput').value=initial==null?'':initial.toFixed(1);
  $('clothes').checked=false;
  setStatus(statusHtml,statusErr);
  updateResult();
  modal.classList.add('show');
}
function setStatus(html,err){const s=$('ocrStatus');s.innerHTML=html||'';s.classList.toggle('err',!!err);}
function updateResult(){
  const raw=parseFloat($('rawInput').value);
  const ok=isFinite(raw)&&raw>=20&&raw<=300;
  if(!ok){$('result').textContent='';$('saveBtn').disabled=true;return;}
  const kg=r1(raw-($('clothes').checked?CLOTHES_KG:0));
  $('result').innerHTML='記録される体重：<b>'+kg.toFixed(1)+' kg</b>';
  $('saveBtn').disabled=false;
}
$('rawInput').addEventListener('input',updateResult);
$('clothes').addEventListener('change',updateResult);

// 写真データは保存しない：確認画面を閉じる時に全て破棄
function discardPhoto(){
  const pv=$('preview');pv.width=0;pv.height=0;pv.style.display='none';
  if(pending&&pending.ocrCanvas){pending.ocrCanvas.width=0;pending.ocrCanvas.height=0;}
  pending=null;$('cam').value='';
}
function closeConfirm(){modal.classList.remove('show');discardPhoto();}
$('cancelBtn').addEventListener('click',closeConfirm);
$('saveBtn').addEventListener('click',()=>{
  const raw=parseFloat($('rawInput').value);
  if(!(raw>=20&&raw<=300))return;
  const clothes=$('clothes').checked;
  state.records.push({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),kg:r1(raw-(clothes?CLOTHES_KG:0)),raw:r1(raw),clothes});
  save();closeConfirm();render();
});

$('camBtn').addEventListener('click',()=>$('cam').click());
$('manualBtn').addEventListener('click',()=>{discardPhoto();openConfirm(null,'体重を入力してください',false);setTimeout(()=>$('rawInput').focus(),50);});

$('cam').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  discardPhoto();
  $('cam').value='';
  openConfirm(null,'<span class="spin"></span>数値を読み取り中…',false);
  let bmp;
  try{ bmp=await loadBitmap(f); }catch(err){ setStatus('写真を読み込めませんでした。数値を手入力してください。',true);return; }
  // プレビュー用(カラー)とOCR用(白黒強調)を作成。どちらもメモリ上のみ。
  const MAX=1400, sc=Math.min(1,MAX/Math.max(bmp.w,bmp.h));
  const w=Math.round(bmp.w*sc),h=Math.round(bmp.h*sc);
  const pv=$('preview');pv.width=w;pv.height=h;pv.style.display='block';
  pv.getContext('2d').drawImage(bmp.src,0,0,w,h);
  const oc=document.createElement('canvas');oc.width=w;oc.height=h;
  const octx=oc.getContext('2d');octx.drawImage(bmp.src,0,0,w,h);
  enhance(octx,w,h,false);
  pending={ocrCanvas:oc};
  if(bmp.close)bmp.close();
  const token=pending;
  try{
    let v=await runOcr(oc);
    if(v==null){ // 反転でもう一度
      enhance(octx,w,h,true);
      v=await runOcr(oc);
    }
    if(pending!==token)return; // 途中でキャンセルされた
    if(v!=null){
      $('rawInput').value=v.toFixed(1);updateResult();
      setStatus('読み取り結果です。違う場合は数字を直してください。',false);
    }else{
      setStatus('数値を読み取れませんでした。手入力してください。',true);
    }
  }catch(err){
    if(pending!==token)return;
    setStatus('自動読み取りが使えませんでした（通信または環境の制限）。数値を手入力してください。',true);
  }
});

function loadBitmap(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);res({src:img,w:img.naturalWidth,h:img.naturalHeight});};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
// グレースケール化＋コントラスト伸長(必要なら反転)
function enhance(ctx,w,h,invert){
  const id=ctx.getImageData(0,0,w,h),d=id.data;
  let lo=255,hi=0;const g=new Uint8ClampedArray(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++){const v=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[j]=v;if(v<lo)lo=v;if(v>hi)hi=v;}
  const span=Math.max(1,hi-lo);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    let v=(g[j]-lo)/span*255;
    v=v<110?0:v>150?255:(v-110)/40*255; // ゆるい二値化
    if(invert)v=255-v;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(id,0,0);
}
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('tess-load'));
    document.head.appendChild(s);
  });
}
let worker=null;
async function getWorker(){
  if(worker)return worker;
  await loadTess();
  const w=await Tesseract.createWorker('eng');
  await w.setParameters({tessedit_char_whitelist:'0123456789.',tessedit_pageseg_mode:'11'});
  worker=w;return w;
}
async function runOcr(canvas){
  const job=(async()=>{const w=await getWorker();const r=await w.recognize(canvas);return parseWeight(r.data.text||'');})();
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),45000));
  return Promise.race([job,timeout]);
}
// 例: "65.5" / "655"(小数点が欠けた場合は1桁下げる)
function parseWeight(t){
  const c=[];
  (t.match(/\d{1,3}[.,]\d/g)||[]).forEach(m=>c.push(parseFloat(m.replace(',','.'))));
  if(!c.length)(t.match(/\d{3,4}/g)||[]).forEach(m=>c.push(parseInt(m,10)/10));
  const ok=c.filter(v=>v>=20&&v<=300);
  return ok.length?ok[0]:null;
}

/* ---------- BMI・個人設定 ---------- */
function bmiCat(b){return b<18.5?'低体重':b<25?'普通体重':b<30?'肥満(1度)':b<35?'肥満(2度)':b<40?'肥満(3度)':'肥満(4度)';}
// 基礎代謝: Mifflin-St Jeor式(「回答しない」は男女の中間値)
function calcBmr(kg,p){
  if(!p||!p.height||!p.age||!p.sex)return null;
  const off=p.sex==='male'?5:p.sex==='female'?-161:-78;
  return Math.round(10*kg+6.25*p.height-5*p.age+off);
}
function renderBmi(last){
  const box=$('bmi'),p=state.profile||{},h=p.height;
  if(!h){box.innerHTML='<button class="bmi-link" id="bmiSet">性別・身長・年齢を設定するとBMIと基礎代謝を表示します</button>';
    $('bmiSet').addEventListener('click',openProfile);return;}
  if(!last){box.textContent='';return;}
  const m=h/100,b=last.kg/(m*m);
  let html='BMI '+b.toFixed(1)+'<span class="cat">'+bmiCat(b)+'</span>';
  const bmr=calcBmr(last.kg,p);
  if(bmr!=null)html+='<div class="bmr">基礎代謝 <b>'+bmr.toLocaleString('ja-JP')+'</b> kcal/日</div>';
  else html+='<div><button class="bmi-link" id="bmiSet">性別・年齢を設定すると基礎代謝を表示します</button></div>';
  box.innerHTML=html;
  const l=$('bmiSet');if(l)l.addEventListener('click',openProfile);
}
function openProfile(){
  const p=state.profile||{};
  document.querySelectorAll('input[name=sex]').forEach(r=>{r.checked=(r.value===p.sex);});
  $('heightInput').value=p.height==null?'':p.height;
  $('ageInput').value=p.age==null?'':p.age;
  $('profileModal').classList.add('show');
}
$('profileBtn').addEventListener('click',openProfile);
$('profileCancel').addEventListener('click',()=>$('profileModal').classList.remove('show'));
$('profileSave').addEventListener('click',()=>{
  const sx=document.querySelector('input[name=sex]:checked');
  const h=parseFloat($('heightInput').value),a=parseInt($('ageInput').value,10);
  state.profile={sex:sx?sx.value:'',height:(h>=100&&h<=250)?r1(h):null,age:(a>=1&&a<=120)?a:null};
  save();$('profileModal').classList.remove('show');render();
});

/* ---------- ③ 目標 ---------- */
$('goalEdit').addEventListener('click',()=>{
  $('goalInput').value=state.goal==null?'':state.goal.toFixed(1);
  $('goalDateInput').min=ymd(new Date());
  $('goalDateInput').value=state.goalDate||'';
  $('goalModal').classList.add('show');
});
$('goalCancel').addEventListener('click',()=>$('goalModal').classList.remove('show'));
$('goalSave').addEventListener('click',()=>{
  const v=parseFloat($('goalInput').value);
  state.goal=(v>=20&&v<=300)?r1(v):null;
  const gd=$('goalDateInput').value;
  state.goalDate=(state.goal!=null&&/^\d{4}-\d{2}-\d{2}$/.test(gd))?gd:null;
  save();$('goalModal').classList.remove('show');render();
});

/* ---------- 起動 ---------- */
const now=new Date();
$('today').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日';
load();render();
})();
</script>
